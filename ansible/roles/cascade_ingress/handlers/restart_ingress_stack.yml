---
- name: Run ingress stack ensure script from handler
  become: true
  ansible.builtin.command:
    cmd: /usr/local/sbin/ingress_stack_ensure
    chdir: "{{ cascade_ingress_remote_dir }}"
  register: cascade_ingress_handler_run
  changed_when: false
  ignore_errors: true
  ignore_unreachable: true

- name: Clear ingress host error after handler SSH interruption
  ansible.builtin.meta: clear_host_errors
  when: cascade_ingress_handler_run.unreachable | default(false)

- name: Wait for ingress SSH after handler interruption
  ansible.builtin.wait_for_connection:
    timeout: 180
    delay: 5
    sleep: 5
  when: cascade_ingress_handler_run.unreachable | default(false)

- name: Reset ingress SSH connection after handler interruption
  ansible.builtin.meta: reset_connection

- name: Retry ingress stack ensure script from handler after SSH interruption
  become: true
  ansible.builtin.command:
    cmd: /usr/local/sbin/ingress_stack_ensure
    chdir: "{{ cascade_ingress_remote_dir }}"
  changed_when: false
  when: cascade_ingress_handler_run.unreachable | default(false)

- name: Fail if ingress handler ensure script failed
  ansible.builtin.fail:
    msg: >-
      ingress handler ensure failed with rc={{ cascade_ingress_handler_run.rc | default('unknown') }}:
      {{ cascade_ingress_handler_run.stderr | default(cascade_ingress_handler_run.msg | default('no stderr')) }}
  when:
    - not (cascade_ingress_handler_run.unreachable | default(false))
    - cascade_ingress_handler_run.rc | default(0) != 0
