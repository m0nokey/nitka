---
- name: Prepare SSH TUN client remote directory
  ansible.builtin.file:
    path: "{{ backhaul_ssh_tun_remote_dir }}"
    state: directory
    mode: "0755"

- name: Render SSH TUN client Dockerfile
  ansible.builtin.template:
    src: client/Dockerfile.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/Dockerfile"
    mode: "0644"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN client dockerignore
  ansible.builtin.copy:
    dest: "{{ backhaul_ssh_tun_remote_dir }}/.dockerignore"
    mode: "0644"
    content: |
      *
      !Dockerfile
      !entrypoint.sh
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN client entrypoint
  ansible.builtin.template:
    src: client/entrypoint.sh.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/entrypoint.sh"
    mode: "0755"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN client environment
  ansible.builtin.template:
    src: client/security.env.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/security.env"
    mode: "0600"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN client config
  ansible.builtin.template:
    src: client/ssh_config.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/config"
    mode: "0600"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN client known hosts
  ansible.builtin.template:
    src: client/known_hosts.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/known_hosts"
    mode: "0644"
  notify: Restart SSH TUN endpoint service

- name: Copy SSH TUN keypair to client endpoint
  ansible.builtin.copy:
    src: "{{ backhaul_ssh_tun_ssh_key_dir }}/{{ item.src }}"
    dest: "{{ backhaul_ssh_tun_remote_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: 'id_ed25519', dest: 'id_ed25519', mode: '0600' }
    - { src: 'id_ed25519.pub', dest: 'id_ed25519.pub', mode: '0644' }
  notify: Restart SSH TUN endpoint service
