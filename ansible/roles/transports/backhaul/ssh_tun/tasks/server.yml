---
- name: Prepare SSH TUN server remote directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ topology_cascade_egress_remote_dir }}"
    - "{{ backhaul_ssh_tun_remote_dir }}"

- name: Prepare SSH TUN public key
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    backhaul_ssh_tun_ssh_public_key: "{{ lookup('file', backhaul_ssh_tun_ssh_key_dir ~ '/id_ed25519.pub') | trim }}"
  changed_when: false

- name: Render SSH TUN server environment
  ansible.builtin.template:
    src: server/security.env.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/security.env"
    mode: "0600"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN authorized keys
  ansible.builtin.copy:
    dest: "{{ backhaul_ssh_tun_remote_dir }}/authorized_keys"
    mode: "0600"
    content: "no-agent-forwarding,no-pty,no-user-rc,no-X11-forwarding {{ backhaul_ssh_tun_ssh_public_key }}\n"
  notify: Restart SSH TUN endpoint service

- name: Copy SSH TUN server host keypair to server endpoint
  ansible.builtin.copy:
    src: "{{ backhaul_ssh_tun_ssh_key_dir }}/{{ item.src }}"
    dest: "{{ backhaul_ssh_tun_remote_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: 'ssh_host_ed25519_key', dest: 'ssh_host_ed25519_key', mode: '0600' }
    - { src: 'ssh_host_ed25519_key.pub', dest: 'ssh_host_ed25519_key.pub', mode: '0644' }
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN server Dockerfile
  ansible.builtin.template:
    src: server/Dockerfile.j2
    dest: "{{ backhaul_ssh_tun_remote_dir }}/Dockerfile"
    mode: "0644"
  notify: Restart SSH TUN endpoint service

- name: Render SSH TUN server dockerignore
  ansible.builtin.copy:
    dest: "{{ backhaul_ssh_tun_remote_dir }}/.dockerignore"
    mode: "0644"
    content: |
      *
      !Dockerfile
  notify: Restart SSH TUN endpoint service
