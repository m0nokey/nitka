---
- name: Check standalone SSH proxy Compose file before removal
  ansible.builtin.stat:
    path: "{{ access_ssh_proxy_compose_path }}"
  register: access_ssh_proxy_remove_compose
- name: Remove standalone SSH proxy Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ access_ssh_proxy_dir }}"
    files:
      - compose.yml
    state: absent
    remove_orphans: true
    remove_images: all
    remove_volumes: true
  when: access_ssh_proxy_remove_compose.stat.exists
- name: Remove standalone SSH proxy application directory
  ansible.builtin.file:
    path: "{{ access_ssh_proxy_dir }}"
    state: absent
- name: Remove SSH proxy migration source directory
  ansible.builtin.file:
    path: "{{ access_ssh_proxy_migration_source_dir }}"
    state: absent
