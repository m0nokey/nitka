---
- name: Validate access transport selection
  ansible.builtin.assert:
    that:
      - access_transport_selection | default('xray-reality') is match('^[a-z0-9][a-z0-9-]*$')
      - access_transport_operation | default('deploy') in ['deploy', 'verify', 'restart', 'rollback_install', 'rollback_update', 'remove']
    fail_msg: >-
      Unsupported or unavailable access transport:
      {{ access_transport_selection | default('undefined') }}.
      Transport IDs must use lowercase letters, digits, and hyphens.
  changed_when: false

- name: Normalize selected access transport  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    access_selected_transport: "{{ access_transport_selection | default('xray-reality') }}"

- name: Select access transport role  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    access_selected_role: >-
      {{ {'ssh-proxy': 'ssh_proxy'}.get(
           access_selected_transport,
           access_selected_transport | replace('-', '_')
         ) }}
  changed_when: false

- name: Dispatch selected access adapter
  ansible.builtin.include_role:
    name: "transports/access/{{ access_selected_role }}"  # noqa role-name[path]
    tasks_from: "{{ access_transport_operation | default('deploy') }}"
  vars:
    access_xray_transport: "{{ access_selected_transport }}"
    access_xray_topology: "{{ access_topology_selection | default('standalone') }}"
    access_xray_operation: "{{ access_transport_operation | default('deploy') }}"
    access_ssh_proxy_operation: "{{ access_transport_operation | default('deploy') }}"
