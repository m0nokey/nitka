---
- name: Prepare local ingress directories
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ topology_cascade_ingress_local_dir }}"
    - "{{ topology_cascade_ingress_state_dir }}"

- name: Detect ingress migration source directories before preparing canonical paths
  ansible.builtin.stat:
    path: "{{ topology_cascade_ingress_remote_dir }}/{{ item.old }}"
  loop:
    - { old: 'clashrs', new: 'routing/clashrs' }
    - { old: 'xray', new: 'access/xray-reality' }
  register: topology_cascade_ingress_migration_source_stats
  changed_when: false

- name: Detect canonical ingress component directories
  ansible.builtin.stat:
    path: "{{ topology_cascade_ingress_remote_dir }}/{{ item.new }}"
  loop:
    - { old: 'clashrs', new: 'routing/clashrs' }
    - { old: 'xray', new: 'access/xray-reality' }
  register: topology_cascade_ingress_canonical_component_stats
  changed_when: false

- name: Reject conflicting ingress component directories
  ansible.builtin.assert:
    that:
      - not (
          (item.stat.exists | bool)
          and (topology_cascade_ingress_canonical_component_stats.results[topology_cascade_ingress_migration_index].stat.exists | bool)
        )
    fail_msg: >-
      Both the ingress migration source {{ item.item.old }} and canonical directory
      {{ item.item.new }} exist. Clean up the conflict manually before continuing.
  loop: "{{ topology_cascade_ingress_migration_source_stats.results }}"
  loop_control:
    index_var: topology_cascade_ingress_migration_index

- name: Prepare canonical ingress component parent directories
  ansible.builtin.file:
    path: "{{ topology_cascade_ingress_remote_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ topology_cascade_ingress_routing_dir_name }}"
    - "{{ topology_cascade_ingress_access_dir_name }}"

- name: Migrate ingress component directories to canonical paths
  ansible.builtin.command:
    argv:
      - mv
      - "{{ topology_cascade_ingress_remote_dir }}/{{ item.item.old }}"
      - "{{ topology_cascade_ingress_remote_dir }}/{{ item.item.new }}"
  loop: "{{ topology_cascade_ingress_migration_source_stats.results }}"
  when: item.stat.exists | bool
  changed_when: true

- name: Prepare remote ingress directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ topology_cascade_ingress_remote_dir }}"
    - "{{ topology_cascade_ingress_remote_dir }}/{{ topology_cascade_ingress_routing_dir_name }}"
    - "{{ topology_cascade_ingress_remote_dir }}/{{ topology_cascade_ingress_access_dir_name }}"
    - "{{ topology_cascade_ingress_remote_dir }}/{{ topology_cascade_ingress_backhaul_dir_name }}"

- name: Generate xhttp UUID
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    if command -v uuidgen >/dev/null 2>&1; then
      uuidgen
    else
      cat /proc/sys/kernel/random/uuid
    fi > "{{ topology_cascade_ingress_state_dir }}/xhttp_uuid"
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/xhttp_uuid"
  when: access_xray_xhttp_uuid is not defined

- name: Generate reality UUID
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    if command -v uuidgen >/dev/null 2>&1; then
      uuidgen
    else
      cat /proc/sys/kernel/random/uuid
    fi > "{{ topology_cascade_ingress_state_dir }}/reality_uuid"
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/reality_uuid"
  when: access_xray_reality_uuid is not defined

- name: Generate xhttp port
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    port="{{ access_xray_xhttp_port | default('') }}"
    if [ -z "$port" ]; then
      port="$({{ playbook_dir }}/scripts/generate_port.sh \
        {{ access_xray_xhttp_port_min }} \
        {{ access_xray_xhttp_port_max }})"
    fi
    printf '%s\n' "$port" > "{{ topology_cascade_ingress_state_dir }}/xhttp_port"
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/xhttp_port"
  when: access_xray_xhttp_port is not defined

- name: Generate reality port
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    port="{{ access_xray_reality_port | default('') }}"
    if [ -z "$port" ]; then
      port="$({{ playbook_dir }}/scripts/generate_port.sh \
        {{ access_xray_reality_port_min }} \
        {{ access_xray_reality_port_max }})"
    fi
    printf '%s\n' "$port" > "{{ topology_cascade_ingress_state_dir }}/reality_port"
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/reality_port"
  when: access_xray_reality_port is not defined

- name: Generate reality short id
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    openssl rand -hex 8 > "{{ topology_cascade_ingress_state_dir }}/reality_short_id"
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/reality_short_id"
  when: access_xray_reality_short_id is not defined

- name: Generate reality keypair
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    {{ ansible_playbook_python }} - <<'PY'
    from base64 import urlsafe_b64encode
    from pathlib import Path
    from cryptography.hazmat.primitives.asymmetric import x25519
    from cryptography.hazmat.primitives import serialization

    state = Path("{{ topology_cascade_ingress_state_dir }}")
    priv_path = state / "reality_private_key"
    pub_path = state / "reality_public_key"

    private_key = x25519.X25519PrivateKey.generate()
    public_key = private_key.public_key()

    priv = private_key.private_bytes(
        encoding=serialization.Encoding.Raw,
        format=serialization.PrivateFormat.Raw,
        encryption_algorithm=serialization.NoEncryption(),
    )
    pub = public_key.public_bytes(
        encoding=serialization.Encoding.Raw,
        format=serialization.PublicFormat.Raw,
    )

    priv_path.write_text(urlsafe_b64encode(priv).decode().rstrip("=") + "\n", encoding="utf-8")
    pub_path.write_text(urlsafe_b64encode(pub).decode().rstrip("=") + "\n", encoding="utf-8")
    PY
  args:
    creates: "{{ topology_cascade_ingress_state_dir }}/reality_private_key"
  when: access_xray_reality_private_key is not defined

- name: Check generated Xray state files
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.stat:
    path: "{{ topology_cascade_ingress_state_dir }}/{{ item.name }}"
  loop:
    - { name: 'xhttp_uuid', mode: '0600' }
    - { name: 'reality_uuid', mode: '0600' }
    - { name: 'xhttp_port', mode: '0600' }
    - { name: 'reality_port', mode: '0600' }
    - { name: 'reality_short_id', mode: '0600' }
    - { name: 'reality_private_key', mode: '0600' }
    - { name: 'reality_public_key', mode: '0644' }
  register: topology_cascade_ingress_state_file_stats

- name: Set generated Xray state file permissions
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.file:
    path: "{{ topology_cascade_ingress_state_dir }}/{{ item.item.name }}"
    mode: "{{ item.item.mode }}"
  loop: "{{ topology_cascade_ingress_state_file_stats.results }}"
  when: item.stat.exists
  changed_when: false

- name: Read xhttp UUID
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_xhttp_uuid: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/xhttp_uuid') | trim }}"
  changed_when: false
  when: access_xray_xhttp_uuid is not defined

- name: Read reality UUID
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_reality_uuid: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/reality_uuid') | trim }}"
  changed_when: false
  when: access_xray_reality_uuid is not defined

- name: Read xhttp port
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_xhttp_port: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/xhttp_port') | trim }}"
  changed_when: false
  when: access_xray_xhttp_port is not defined

- name: Read reality port
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_reality_port: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/reality_port') | trim }}"
  changed_when: false
  when: access_xray_reality_port is not defined

- name: Read reality short id
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_reality_short_id: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/reality_short_id') | trim }}"
  changed_when: false
  when: access_xray_reality_short_id is not defined

- name: Read reality public key
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.set_fact:
    access_xray_reality_public_key: "{{ lookup('file', topology_cascade_ingress_state_dir ~ '/reality_public_key') | trim }}"
  changed_when: false
  when: access_xray_reality_public_key is not defined

- name: Validate reality keypair consistency
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  ansible.builtin.shell: |
    set -euo pipefail
    {{ ansible_playbook_python }} - <<'PY'
    from base64 import urlsafe_b64decode, urlsafe_b64encode
    from pathlib import Path
    from cryptography.hazmat.primitives.asymmetric import x25519
    from cryptography.hazmat.primitives import serialization

    state = Path("{{ topology_cascade_ingress_state_dir }}")
    private_text = (state / "reality_private_key").read_text(encoding="utf-8").strip()
    public_text = (state / "reality_public_key").read_text(encoding="utf-8").strip()

    def decode_xray_key(value: str) -> bytes:
        padded = value + "=" * (-len(value) % 4)
        return urlsafe_b64decode(padded.encode("ascii"))

    private_raw = decode_xray_key(private_text)
    if len(private_raw) != 32:
        raise SystemExit(f"invalid reality private key length: {len(private_raw)}")

    expected_public = x25519.X25519PrivateKey.from_private_bytes(private_raw).public_key().public_bytes(
        encoding=serialization.Encoding.Raw,
        format=serialization.PublicFormat.Raw,
    )
    expected_public_text = urlsafe_b64encode(expected_public).decode("ascii").rstrip("=")

    if expected_public_text != public_text:
        raise SystemExit("reality private/public key mismatch")
    PY
  changed_when: false
  when: access_xray_reality_private_key is not defined

- name: Build ingress share links
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  no_log: true
  ansible.builtin.set_fact:
    access_xray_xhttp_share_link: >-
      {{ 'vless://' ~ access_xray_xhttp_uuid ~ '@'
         ~ access_xray_public_host ~ ':' ~ access_xray_xhttp_port
         ~ '?encryption=none&security=reality&sni='
         ~ (access_xray_obfs_host | urlencode) ~ '&fp=chrome&pbk='
         ~ access_xray_reality_public_key ~ '&sid='
         ~ access_xray_reality_short_id ~ '&type=xhttp&path='
         ~ (access_xray_obfs_path | urlencode) ~ '&mode=packet-up#'
         ~ (access_xray_xhttp_remarks | urlencode) }}
    access_xray_reality_share_link: >-
      {{ 'vless://' ~ access_xray_reality_uuid ~ '@'
         ~ access_xray_public_host ~ ':' ~ access_xray_reality_port
         ~ '?encryption=none&security=reality&sni='
         ~ (access_xray_obfs_host | urlencode) ~ '&fp=chrome&headerType=none&pbk='
         ~ access_xray_reality_public_key ~ '&sid='
         ~ access_xray_reality_short_id ~ '&type=tcp&flow=xtls-rprx-vision#'
         ~ (access_xray_reality_remarks | urlencode) }}
  changed_when: false

- name: Write share links to file
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true
  ansible.builtin.copy:
    dest: "{{ access_xray_share_link_path }}"
    mode: "0600"
    content: |
      {{ access_xray_xhttp_share_link }}
      {{ access_xray_reality_share_link }}
  vars:
    ansible_connection: local
    ansible_remote_tmp: /tmp/ansible-local
  changed_when: false

- name: Render docker compose
  become: true
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ topology_cascade_ingress_remote_dir }}/compose.yml"
    mode: "0644"

- name: Validate rendered docker compose
  become: true
  ansible.builtin.command:
    cmd: docker compose -f "{{ topology_cascade_ingress_remote_dir }}/compose.yml" config -q
  changed_when: false

- name: Render clash config
  ansible.builtin.template:
    src: clashrs/config.yaml.j2
    dest: "{{ topology_cascade_ingress_remote_dir }}/{{ topology_cascade_ingress_routing_dir_name }}/config.yaml"
    mode: "0644"

- name: Render xray config
  become: true
  ansible.builtin.template:
    src: xray/config.json.j2
    dest: "{{ topology_cascade_ingress_remote_dir }}/{{ topology_cascade_ingress_access_dir_name }}/config.json"
    mode: "0644"
    validate: >-
      docker run --rm
      -v %s:/etc/xray/config.json:ro
      ghcr.io/xtls/xray-core:26.6.27
      run -test -c /etc/xray/config.json

- name: Render ingress watchdog script
  become: true
  ansible.builtin.template:
    src: cascade-ingress-watchdog.sh.j2
    dest: /usr/local/sbin/cascade-ingress-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Render ingress watchdog service
  become: true
  ansible.builtin.template:
    src: cascade-ingress-watchdog.service.j2
    dest: /etc/systemd/system/cascade-ingress-watchdog.service
    owner: root
    group: root
    mode: "0644"
  register: topology_cascade_ingress_watchdog_service

- name: Render ingress watchdog timer
  become: true
  ansible.builtin.template:
    src: cascade-ingress-watchdog.timer.j2
    dest: /etc/systemd/system/cascade-ingress-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  register: topology_cascade_ingress_watchdog_timer

- name: Render ingress stack ensure script
  become: true
  ansible.builtin.template:
    src: ingress_stack_ensure.sh.j2
    dest: /usr/local/sbin/ingress_stack_ensure
    owner: root
    group: root
    mode: "0755"

- name: Stop and disable ingress watchdog timer before stack changes
  become: true
  ansible.builtin.systemd_service:
    name: cascade-ingress-watchdog.timer
    enabled: false
    state: stopped
  changed_when: false
  failed_when: false

- name: Mask ingress watchdog timer before stack changes
  become: true
  ansible.builtin.systemd_service:
    name: cascade-ingress-watchdog.timer
    masked: true
    state: stopped
  changed_when: false
  failed_when: false

- name: Reload systemd after masking ingress watchdog timer
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Stop ingress watchdog service before stack changes
  become: true
  ansible.builtin.systemd_service:
    name: cascade-ingress-watchdog.service
    state: stopped
  failed_when: false

- name: Ensure ingress stack is running
  block:
    - name: Stop Cascade ingress updater before stack changes
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - cascade-ingress-docker-updater.timer
        - cascade-ingress-docker-updater.service
      failed_when: false

    - name: Run ingress stack ensure script
      become: true
      ansible.builtin.command:
        cmd: /usr/local/sbin/ingress_stack_ensure
        chdir: "{{ topology_cascade_ingress_remote_dir }}"
      register: topology_cascade_ingress_stack_run
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: Clear ingress host error after SSH interruption
      ansible.builtin.meta: clear_host_errors
      when: topology_cascade_ingress_stack_run.unreachable | default(false)

    - name: Wait for ingress SSH after interruption
      ansible.builtin.wait_for_connection:
        timeout: 180
        delay: 5
        sleep: 5
      when: topology_cascade_ingress_stack_run.unreachable | default(false)

    - name: Reset ingress SSH connection after interruption
      ansible.builtin.meta: reset_connection

    - name: Retry ingress stack ensure script after SSH interruption
      become: true
      ansible.builtin.command:
        cmd: /usr/local/sbin/ingress_stack_ensure
        chdir: "{{ topology_cascade_ingress_remote_dir }}"
      register: topology_cascade_ingress_stack_retry
      changed_when: false
      when: topology_cascade_ingress_stack_run.unreachable | default(false)

    - name: Fail if ingress stack ensure script failed
      ansible.builtin.fail:
        msg: >-
          ingress stack ensure failed with rc={{ topology_cascade_ingress_stack_run.rc | default('unknown') }}:
          {{ topology_cascade_ingress_stack_run.stderr | default(topology_cascade_ingress_stack_run.msg | default('no stderr')) }}
      when:
        - not (topology_cascade_ingress_stack_run.unreachable | default(false))
        - topology_cascade_ingress_stack_run.rc | default(0) != 0

  rescue:
    - name: Remove incomplete Cascade ingress stack
      become: true
      ansible.builtin.shell: >-
        if [ -f "{{ topology_cascade_ingress_remote_dir }}/compose.yml" ]; then
          docker compose -f "{{ topology_cascade_ingress_remote_dir }}/compose.yml" down --remove-orphans;
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Restore current Cascade ingress stack from backup
      become: true
      ansible.builtin.shell: |
        set -eu
        latest=/var/lib/nitka/backup/cascade-ingress.latest
        if [ -s "$latest" ] && [ -d "$(cat "$latest")" ]; then
          backup_dir="$(cat "$latest")"
          failed_dir="{{ topology_cascade_ingress_remote_dir }}.failed.$$"
          mv "{{ topology_cascade_ingress_remote_dir }}" "$failed_dir"
          install -d -m 0755 "{{ topology_cascade_ingress_remote_dir }}"
          if ! cp -a "$backup_dir/." "{{ topology_cascade_ingress_remote_dir }}/"; then
            rm -rf "{{ topology_cascade_ingress_remote_dir }}"
            mv "$failed_dir" "{{ topology_cascade_ingress_remote_dir }}"
            exit 1
          fi
          rm -rf "$failed_dir"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Restore current Cascade ingress Docker stack after failed deployment
      become: true
      ansible.builtin.shell: >-
        if [ -f "{{ topology_cascade_ingress_remote_dir }}/compose.yml" ]; then
          docker compose -f "{{ topology_cascade_ingress_remote_dir }}/compose.yml" up -d;
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Restore Cascade ingress updater after failed deployment
      become: true
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - cascade-ingress-docker-updater.timer
        - cascade-os-updater.timer
      failed_when: false

    - name: Fail Cascade ingress deployment after rollback
      ansible.builtin.fail:
        msg: >-
          ingress stack deployment failed; the previous Cascade ingress stack was restored.
          Cascade command output: {{ topology_cascade_ingress_stack_run.stderr | default(topology_cascade_ingress_stack_run.msg | default('no stderr')) }}

- name: Keep ingress watchdog timer masked and stopped
  become: true
  ansible.builtin.systemd_service:
    name: cascade-ingress-watchdog.timer
    enabled: false
    masked: true
    state: stopped
  changed_when: false
  failed_when: false

- name: Reload systemd before enabling ingress watchdog service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable Cascade ingress updater timers after successful deployment
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cascade-ingress-docker-updater.timer
    - cascade-os-updater.timer
  failed_when: false

- name: Enable ingress watchdog service
  become: true
  ansible.builtin.systemd_service:
    name: cascade-ingress-watchdog.service
    enabled: true
    state: "{{ 'restarted' if (topology_cascade_ingress_watchdog_service.changed or topology_cascade_ingress_watchdog_timer.changed) else 'started' }}"
