---
- name: Restart egress stack
  ansible.builtin.shell: |
    set -uo pipefail
    backhaul_service="{{ backhaul_ssh_tun_service_name | default('ssh_tun_server') }}"
    backhaul_container="{{ backhaul_ssh_tun_container_name | default('cascade-ssh-tun-server') }}"
    backhaul_context="{{ backhaul_ssh_tun_build_context | default('ssh_tun_server') }}"
    backhaul_image="{{ backhaul_ssh_tun_image | default('local/cascade-ssh-tun-server:latest') }}"
    stack_change=0
    recover_previous() {
      latest=/var/lib/nitka/backup/cascade-egress.latest
      if [ -s "$latest" ] && [ -d "$(cat "$latest")" ]; then
        backup_dir="$(cat "$latest")"
        failed_dir="{{ topology_cascade_egress_remote_dir }}.failed.$$"
        docker compose -f "{{ topology_cascade_egress_remote_dir }}/compose.yml" down --remove-orphans >/dev/null 2>&1 || true
        if mv "{{ topology_cascade_egress_remote_dir }}" "$failed_dir" 2>/dev/null; then
          install -d -m 0755 "{{ topology_cascade_egress_remote_dir }}"
          if cp -a "$backup_dir/." "{{ topology_cascade_egress_remote_dir }}/"; then
            rm -rf "$failed_dir"
            docker compose -f "{{ topology_cascade_egress_remote_dir }}/compose.yml" up -d >/dev/null 2>&1 || true
            systemctl enable --now cascade-egress-docker-updater.timer cascade-os-updater.timer >/dev/null 2>&1 || true
            return 0
          fi
          rm -rf "{{ topology_cascade_egress_remote_dir }}"
          mv "$failed_dir" "{{ topology_cascade_egress_remote_dir }}"
        fi
      fi
      docker compose -f "{{ topology_cascade_egress_remote_dir }}/compose.yml" down --remove-orphans >/dev/null 2>&1 || true
      systemctl disable --now cascade-egress-docker-updater.timer cascade-egress-docker-updater.service >/dev/null 2>&1 || true
    }
    on_exit() {
      rc="$?"
      if [ "$stack_change" -eq 1 ] && [ "$rc" -ne 0 ]; then
        recover_previous
      fi
      exit "$rc"
    }
    trap on_exit EXIT
    for unit in cascade-egress-docker-updater.timer cascade-egress-docker-updater.service cascade-os-updater.timer cascade-os-updater.service; do
      systemctl disable --now "$unit" >/dev/null 2>&1 || true
    done
    docker compose -f "{{ topology_cascade_egress_remote_dir }}/compose.yml" down --remove-orphans >/dev/null 2>&1 || true
    for container in "$backhaul_container" cascade-unbound; do
      if docker inspect "$container" >/dev/null 2>&1; then
        docker update --restart=no "$container" >/dev/null 2>&1 || true
        docker stop "$container" >/dev/null 2>&1 || true
      fi
    done
    stack_change=1
    topology_cascade_egress_debug="{{ topology_cascade_egress_debug | default(false) | bool | ternary('1', '0') }}"
    if [ "$topology_cascade_egress_debug" = "1" ]; then
      echo "===== docker compose config ====="
      docker compose config
      echo "===== docker compose up ====="
    fi
    wait_healthy() {
      container="$1"
      timeout="$2"
      report_failure() {
        inspect_format="$container state={% raw %}{{.State.Status}} exit={{.State.ExitCode}}{% endraw %}"
        inspect_format="$inspect_format error={% raw %}{{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}"
        docker inspect -f "$inspect_format" "$container" 2>/dev/null || true
        echo "===== $container logs =====" >&2
        docker logs --tail=200 "$container" 2>&1 || true
      }
      end=$((SECONDS + timeout))
      while [ "$SECONDS" -lt "$end" ]; do
        health_format='{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}'
        status="$(docker inspect -f "$health_format" "$container" 2>/dev/null || true)"
        [ "$status" = "healthy" ] && return 0
        [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ] || {
          sleep 2
          continue
        }
        report_failure
        return 1
      done
      report_failure
      return 1
    }
    build_if_needed() {
      service="$1"
      image="$2"
      context="$3"
      state_dir=".build-fingerprints"
      state_file="$state_dir/${service}.sha256"
      mkdir -p "$state_dir"
      fingerprint="$(
        {
          docker compose config
          find "$context" -type f -print0 | sort -z | xargs -0 sha256sum
        } | sha256sum | sed -nE 's/^([0-9a-fA-F]+)[[:space:]].*/\1/p'
      )"
      old_fingerprint="$(cat "$state_file" 2>/dev/null || true)"
      if ! docker image inspect "$image" >/dev/null 2>&1 || [ "$fingerprint" != "$old_fingerprint" ]; then
        docker compose build "$service" || return 1
        printf '%s\n' "$fingerprint" > "$state_file"
      fi
    }
    build_if_needed "$backhaul_service" "$backhaul_image" "./$backhaul_context" || exit 1
    build_if_needed unbound local/cascade-unbound:latest ./dns || exit 1
    docker compose up -d --no-build --remove-orphans
    rc1=$?
    [ "$rc1" -eq 0 ] || exit 1
    wait_healthy "$backhaul_container" 120 || exit 1
    if [ "$topology_cascade_egress_debug" = "1" ]; then
      echo "===== docker compose recreate unbound ====="
    fi
    docker compose up -d --force-recreate --no-deps unbound
    rc2=$?
    [ "$rc2" -eq 0 ] || exit 1
    wait_healthy cascade-unbound 120 || exit 1
    if [ "$topology_cascade_egress_debug" = "1" ]; then
      echo "===== docker compose ps ====="
      docker compose ps -a || true
      echo "===== docker ps ====="
      docker ps -a --format 'table {% raw %}{{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}{% endraw %}' || true
      echo "===== container state ====="
      inspect_format="$container state={% raw %}{{.State.Status}} running={{.State.Running}}"
      inspect_format="$inspect_format restarting={{.State.Restarting}} exit={{.State.ExitCode}}"
      inspect_format="$inspect_format error={{.State.Error}} health={{if .State.Health}}"
      inspect_format="$inspect_format{{.State.Health.Status}}{{else}}none{{end}}{% endraw %}"
      for container in "$backhaul_container" cascade-unbound; do
        docker inspect -f "$inspect_format" "$container" 2>/dev/null || true
      done
      echo "===== docker compose logs ====="
      docker compose logs --tail=160 || true
      echo "===== direct container logs ====="
      for container in "$backhaul_container" cascade-unbound; do
        echo "----- $container -----"
        docker logs --tail=120 "$container" 2>&1 || true
      done
    fi
    if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
      exit 1
    fi
    stack_change=0
    systemctl enable --now cascade-egress-docker-updater.timer cascade-os-updater.timer >/dev/null 2>&1 || exit 1
    trap - EXIT
  args:
    chdir: "{{ topology_cascade_egress_remote_dir }}"
    executable: /bin/bash
  become: true
  changed_when: true
