---
- name: Restart Xray
  ansible.builtin.shell: |
    set -uo pipefail
    stack_change=0
    wait_healthy() {
      container="$1"
      timeout_seconds="$2"
      end=$((SECONDS + timeout_seconds))
      while [ "$SECONDS" -lt "$end" ]; do
        health_format='{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}'
        status="$(docker inspect -f "$health_format" "$container" 2>/dev/null || true)"
        [ "$status" = "healthy" ] && return 0
        [ "$status" = "exited" ] || [ "$status" = "dead" ] || {
          sleep 2
          continue
        }
        return 1
      done
      return 1
    }
    wait_port() {
      port="$1"
      timeout_seconds="$2"
      end=$((SECONDS + timeout_seconds))
      while [ "$SECONDS" -lt "$end" ]; do
        if timeout 2 bash -c "</dev/tcp/127.0.0.1/${port}" >/dev/null 2>&1; then
          return 0
        fi
        sleep 2
      done
      return 1
    }
    restore_previous() {
      latest=/var/lib/nitka/backup/xray.latest
      if [ -s "$latest" ] && [ -d "$(cat "$latest")" ]; then
        backup_dir="$(cat "$latest")"
        failed_dir="{{ xray_dir }}.failed.$$"
        docker compose -f "{{ xray_compose_path }}" down --remove-orphans >/dev/null 2>&1 || true
        if mv "{{ xray_dir }}" "$failed_dir" 2>/dev/null; then
          install -d -m 0750 "{{ xray_dir }}"
          if cp -a "$backup_dir/." "{{ xray_dir }}/"; then
            rm -rf "$failed_dir"
            docker compose -f "{{ xray_compose_path }}" up -d >/dev/null 2>&1 || true
            return 0
          fi
          rm -rf "{{ xray_dir }}"
          mv "$failed_dir" "{{ xray_dir }}"
        fi
      fi
      docker compose -f "{{ xray_compose_path }}" down --remove-orphans >/dev/null 2>&1 || true
    }
    on_exit() {
      rc="$?"
      if [ "$stack_change" -eq 1 ] && [ "$rc" -ne 0 ]; then
        restore_previous
      fi
      exit "$rc"
    }
    trap on_exit EXIT
    stack_change=1
    docker compose -f "{{ xray_compose_path }}" up -d --force-recreate --no-deps xray
    wait_healthy "{{ xray_container_name }}" 120
    wait_port "{{ xray_state.vision_port }}" 45
    wait_port "{{ xray_state.xhttp_port }}" 45
    stack_change=0
    trap - EXIT
  args:
    executable: /bin/bash
  become: true
  changed_when: true
