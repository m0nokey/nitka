---
- name: Prepare final SSH hardening facts
  ansible.builtin.import_tasks: prepare_ssh_hardening.yml

- name: Install final hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s

- name: Reload SSH daemon after final hardening
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl reload ssh || systemctl reload sshd
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify effective final SSH port
  ansible.builtin.shell: |
    set -o pipefail
    sshd -T | sed -nE 's/^port[[:space:]]+([0-9]+)$/\1/p' | head -n 1
  args:
    executable: /bin/bash
  register: system_base_effective_final_ssh_port
  changed_when: false
  failed_when: >-
    system_base_effective_final_ssh_port.stdout | trim != (system_base_management_sshd_port | string)
