---
- name: Require deploy SSH key
  ansible.builtin.assert:
    that:
      - system_base_deploy_authorized_key | length > 0
    fail_msg: >-
      Pass system_base_deploy_authorized_key from the encrypted local state.

- name: Create original SSH backup directory before installation
  ansible.builtin.file:
    path: "{{ system_base_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether the original sshd_config is already backed up
  ansible.builtin.stat:
    path: "{{ system_base_ssh_config_backup }}"
  register: system_base_bootstrap_ssh_config_backup

- name: Save the original sshd_config before installation
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: "{{ system_base_ssh_config_backup }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - not system_base_bootstrap_ssh_config_backup.stat.exists
    - ansible_facts.os_family == "Debian"

- name: Check whether original SSH host keys are already backed up
  ansible.builtin.stat:
    path: "{{ system_base_ssh_host_keys_backup_marker }}"
  register: system_base_bootstrap_host_keys_backup

- name: Save original SSH host keys before installation
  ansible.builtin.shell: |
    set -euo pipefail
    found=0
    install -d -m 0700 "{{ system_base_ssh_host_keys_backup_dir }}"
    for key in /etc/ssh/ssh_host_*; do
      [ -f "$key" ] || continue
      cp -a "$key" "{{ system_base_ssh_host_keys_backup_dir }}/"
      found=1
    done
    [ "$found" -eq 1 ]
    touch "{{ system_base_ssh_host_keys_backup_marker }}"
    chmod 0600 "{{ system_base_ssh_host_keys_backup_marker }}"
  args:
    executable: /bin/bash
  changed_when: true
  when: not system_base_bootstrap_host_keys_backup.stat.exists

- name: Install sudo for bootstrap
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    install_recommends: false
  when: ansible_facts.os_family == "Debian"

- name: Check whether deploy user already exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ system_base_deploy_user }}"
  register: system_base_deploy_user_lookup
  failed_when: false

- name: Mark deploy user created by Nitka
  when:
    - not (
        system_base_deploy_user_lookup.ansible_facts.getent_passwd
        | default(false)
      )
  block:
    - name: Create Nitka state directory
      ansible.builtin.file:
        path: "{{ system_base_deploy_user_marker | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Mark deploy user created by Nitka
      ansible.builtin.file:
        path: "{{ system_base_deploy_user_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
- name: Create deploy group
  ansible.builtin.group:
    name: "{{ system_base_deploy_user }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ system_base_deploy_user }}"
    group: "{{ system_base_deploy_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present

- name: Ensure deploy SSH directory permissions
  ansible.builtin.file:
    path: "/home/{{ system_base_deploy_user }}/.ssh"
    state: directory
    owner: "{{ system_base_deploy_user }}"
    group: "{{ system_base_deploy_user }}"
    mode: "0700"

- name: Ensure deploy Ansible temporary directory permissions
  ansible.builtin.file:
    path: "/home/{{ system_base_deploy_user }}/.ansible/tmp"
    state: directory
    owner: "{{ system_base_deploy_user }}"
    group: "{{ system_base_deploy_user }}"
    mode: "0700"

- name: Install deploy authorized key
  ansible.builtin.copy:
    dest: "/home/{{ system_base_deploy_user }}/.ssh/authorized_keys"
    owner: "{{ system_base_deploy_user }}"
    group: "{{ system_base_deploy_user }}"
    mode: "0600"
    content: "{{ system_base_deploy_authorized_key | trim }}\n"

- name: Install passwordless deploy sudoers file
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ system_base_deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      {{ system_base_deploy_user }} ALL=(ALL) NOPASSWD:ALL

- name: Verify passwordless deploy sudo
  become: true
  become_user: "{{ system_base_deploy_user }}"
  ansible.builtin.command: sudo -n true
  changed_when: false
