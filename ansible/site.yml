---
- name: Deploy Xray VPN
  hosts: xray_nodes
  become: true
  gather_facts: false
  force_handlers: true
  pre_tasks:
    - name: Wait for initial SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
    - name: Gather VPS facts after SSH is available
      ansible.builtin.setup:
  roles:
    - role: system_base
    - role: transports/access  # noqa role-name[path]
      vars:
        access_topology: standalone
        access_transport: "{{ xray_access_transport | default('xray-reality') }}"
