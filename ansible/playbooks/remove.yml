---
- name: Remove selected VPN stack
  hosts: xray_nodes
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2

  roles:
    - role: transports/access  # noqa role-name[path]
      vars:
        access_transport_operation: remove
      when: (topology_selection | default('standalone')) == 'standalone'
    - role: topology/cascade/ingress  # noqa role-name[path]
      tasks_from: remove
      when:
        - (topology_selection | default('standalone')) == 'cascade'
        - (topology_cascade_node_role | default('')) == 'ingress'
    - role: topology/cascade/egress  # noqa role-name[path]
      tasks_from: remove
      when:
        - (topology_selection | default('standalone')) == 'cascade'
        - (topology_cascade_node_role | default('')) == 'egress'
    - role: transports/backhaul  # noqa role-name[path]
      vars:
        backhaul_transport_operation: remove
      when: (topology_selection | default('standalone')) == 'cascade'
