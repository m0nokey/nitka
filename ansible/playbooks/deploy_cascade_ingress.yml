---
- name: Deploy Cascade ingress stack
  hosts: cascade_ingress
  become: true
  gather_facts: true
  force_handlers: true
  pre_tasks:
    - name: Snapshot current Cascade ingress stack before deployment
      ansible.builtin.shell: |
        set -eu
        source_dir="{{ topology_cascade_ingress_remote_dir }}"
        backup_root="/var/lib/nitka/backup/cascade-ingress"
        latest="$backup_root.latest"
        if [ -f "$source_dir/compose.yml" ]; then
          backup="$backup_root.$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 0700 "$backup"
          cp -a "$source_dir/." "$backup/"
          printf '%s\n' "$backup" > "$latest"
          chmod 0600 "$latest"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
  roles:
    - role: system_base
      vars:
        system_base_deploy_authorized_key: "{{ topology_cascade_ingress_deploy_authorized_key }}"
        system_base_management_sshd_port: "{{ topology_cascade_ingress_management_sshd_port }}"
        system_base_harden_ssh_initial_user: "{{ topology_cascade_ingress_harden_ssh_initial_user }}"
        system_base_harden_ssh_preserve_users: "{{ topology_cascade_ingress_harden_ssh_preserve_users }}"
        system_base_os_updater_name: cascade
        system_base_enable_docker_updater: true
        system_base_docker_updater_name: "{{ topology_cascade_ingress_updater_name | default('cascade-ingress') }}"
        system_base_docker_updater_calendar: "*-*-* 02:20"
        system_base_docker_updater_compose_file: "{{ topology_cascade_ingress_remote_dir }}/compose.yml"
        system_base_docker_updater_services:
          - service: "{{ backhaul_ssh_tun_client_service_name | default('ssh_tun_client') }}"
            container: "{{ backhaul_ssh_tun_client_container_name | default('cascade-ssh-tun-client') }}"
            image_type: build
            base_image: alpine:3.23
            cascade_restart:
              - clashrs
              - xray
          - service: clashrs
            container: cascade-clashrs
            image_type: external
            image: local/cascade-clash-rs:latest
            release_repo: Watfaq/clash-rs
            release_image_template: ghcr.io/watfaq/clash-rs:latest
            cascade_restart:
              - xray
          - service: xray
            container: cascade-xray
            image_type: external
            image: local/cascade-xray-core:auto
            release_repo: XTLS/Xray-core
            release_image_template: ghcr.io/xtls/xray-core:latest
    - role: transports/backhaul  # noqa role-name[path]
      vars:
        backhaul_endpoint_selection: client
        backhaul_transport_selection: "{{ topology_cascade_ingress_backhaul_transport | default('ssh-tun') }}"
        backhaul_transport_operation: deploy
      when:
        - topology_cascade_ingress_manage_backhaul | default(true) | bool
    - role: transports/access  # noqa role-name[path]
      vars:
        access_topology_selection: cascade
        access_transport_selection: "{{ topology_cascade_ingress_access_transport | default('xray-reality') }}"
        access_transport_operation: deploy
