---
- name: Prepare Cascade ingress management access
  hosts: cascade_ingress
  become: true
  gather_facts: true
  tasks:
    - name: Prepare ingress management access
      ansible.builtin.include_role:
        name: system_base
        tasks_from: management_access
      vars:
        system_base_deploy_authorized_key: "{{ topology_cascade_ingress_deploy_authorized_key }}"
        system_base_harden_ssh_initial_user: "{{ topology_cascade_ingress_harden_ssh_initial_user }}"
        system_base_harden_ssh_preserve_users: "{{ topology_cascade_ingress_harden_ssh_preserve_users }}"

- name: Prepare Cascade egress management access
  hosts: cascade_egress
  become: true
  gather_facts: true
  tasks:
    - name: Prepare egress management access
      ansible.builtin.include_role:
        name: system_base
        tasks_from: management_access
      vars:
        system_base_deploy_authorized_key: "{{ topology_cascade_egress_deploy_authorized_key }}"
        system_base_harden_ssh_initial_user: "{{ topology_cascade_egress_harden_ssh_initial_user }}"
        system_base_harden_ssh_preserve_users: "{{ topology_cascade_egress_harden_ssh_preserve_users }}"
