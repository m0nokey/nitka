---
- name: Restart selected standalone access transport
  hosts: xray_nodes
  become: true
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 30
        sleep: 2
  roles:
    - role: transports/access  # noqa role-name[path]
      vars:
        access_topology_selection: standalone
        access_transport_operation: restart
