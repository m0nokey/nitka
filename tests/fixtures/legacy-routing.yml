topology_cascade_ingress_clash_tcp_concurrent: false
access_xray_reality_proxy_domains_first:
  - domain:first.example
access_xray_reality_proxy_domains_second:
  - keyword:second
access_xray_reality_proxy_domains: >-
  {{ access_xray_reality_proxy_domains_second
     + access_xray_reality_proxy_domains_first }}
access_xray_reality_proxy_ips_first:
  - 192.0.2.0/24
access_xray_reality_proxy_ips: >-
  {{ access_xray_reality_proxy_ips_first }}
access_xray_reality_direct_domains:
  - domain:direct.example
access_xray_xhttp_direct_domains:
  - full:api.direct.example
access_xray_dns_direct_domains: >-
  {{ access_xray_reality_direct_domains
     + access_xray_xhttp_direct_domains }}
access_xray_dns_direct_servers:
  - address: https://dns.example/dns-query
access_xray_block_domains:
  - geosite:category-ads-all
access_xray_block_ips: []
