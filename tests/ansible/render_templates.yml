---
- name: Render Xray stack templates for CI validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../ansible/roles/transports/access/xray_reality/defaults/main.yml
  vars:
    render_dir: /tmp/nitka-template-test
    access_xray_server_name: example.com
    access_xray_public_host: 203.0.113.10
    access_xray_xhttp_path: /xhttp
    access_xray_dns_profile: optimal
    access_xray_dns_source_names:
      - urlhaus
      - hagezi-tif-mini
    access_xray_local_region_countries:
      - de
      - ru
    access_xray_state:
      vision_port: 24680
      xhttp_port: 35791
      reality_private_key: test-reality-private-key
      reality_short_id: 0123456789abcdef
      access_keys:
        - key_id: key-test
          vision_uuid: 11111111-1111-4111-8111-111111111111
          xhttp_uuid: 22222222-2222-4222-8222-222222222222
    ansible_port: 22
    system_base_management_sshd_port: 38251
    system_base_deploy_user: deploy
    system_base_harden_ssh_initial_user: debian
    system_base_harden_ssh_preserve_users: []
    system_base_harden_ssh_kex_algorithms: >-
      mlkem768x25519-sha256,sntrup761x25519-sha512
  tasks:
    - name: Create render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0700"

    - name: Render Xray stack templates
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/roles/transports/access/xray_reality/templates/{{ item }}"
        dest: "{{ render_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      loop:
        - config.json.j2
        - compose.yml.j2
        - unbound.conf.j2
        - unbound.Dockerfile.j2

    - name: Render standalone SSH transport templates
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/roles/transports/access/ssh_proxy/templates/{{ item }}"
        dest: "{{ render_dir }}/ssh-{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      vars:
        access_ssh_proxy_service_name: nitka-ssh-transport
        access_ssh_proxy_container_name: nitka-ssh-transport
        access_ssh_proxy_image: local/nitka-ssh-transport:latest
        access_ssh_proxy_group: proxy
        access_ssh_proxy_internal_port: 2222
        access_ssh_proxy_external_port: 30422
        access_ssh_proxy_host_key_volume: nitka_ssh_transport_host_keys
        access_ssh_proxy_access_keys:
          - key_id: ssh-test-1
            username: abcdefgh1234
            authorized_key: >-
              ssh-ed25519
              AAAAC3NzaC1lZDI1NTE5AAAAIB2Yt5cWm3p3jL8Yq6jJf4vG9oH8c5h4y2p1x0z9
              test
          - key_id: ssh-test-2
            username: zyxwvuts9876
            authorized_key: >-
              ssh-ed25519
              AAAAC3NzaC1lZDI1NTE5AAAAIB2Yt5cWm3p3jL8Yq6jJf4vG9oH8c5h4y2p1x0z9
              test-2
        access_ssh_proxy_kex_algorithms: >-
          curve25519-sha256,curve25519-sha256@libssh.org,
          mlkem768x25519-sha256,sntrup761x25519-sha512,
          sntrup761x25519-sha512@openssh.com
      loop:
        - Dockerfile.j2
        - entrypoint.sh.j2
        - sshd_config.j2
        - compose.yml.j2

    - name: Render SSH transition template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/roles/system_base/templates/sshd_config_transition.j2"
        dest: "{{ render_dir }}/ssh-transition.conf"
        mode: "0600"
