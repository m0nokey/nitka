services:
  nitka:
    build:
      context: ..
      dockerfile: controller/Dockerfile
      args:
        NITKA_UID: ${NITKA_UID:-1000}
    image: local/nitka:latest
    pull_policy: never
    container_name: nitka
    working_dir: /workspace
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash", "/workspace/controller/entrypoint.sh"]
    environment:
      TZ: UTC
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      ANSIBLE_FORCE_COLOR: "true"
      XDG_STATE_HOME: /state
      NITKA_HOST_STATE_DIR: ${XDG_STATE_HOME:-${HOME}/.local/state}/nitka
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    volumes:
      - type: bind
        source: ..
        target: /workspace
        read_only: true
      - type: bind
        source: ${NITKA_STATE_DIR:-${HOME}/.local/state}/nitka
        target: /state/nitka
    restart: "no"
